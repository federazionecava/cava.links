  <script>
    // Traducciones. Para sumar un idioma, copiá un bloque, usá su código de dos letras
    // (por ejemplo "pt") y agregá su botón en <div class="idiomas">.
    var TRADUCCIONES = {
      es: {
        subtitulo: "COMITE DE ASOCIACIONES VENETAS DE ARGENTINA",
        comitato: "Conocé el CAVA",
        instagram: "Seguinos en Instagram",
        facebook: "Seguinos en Facebook",
        web: "Visita Nuestra Web",
        mail: "Contactate por Mail"
      },
      it: {
        subtitulo: "COMITATO DELLE ASSOCIAZIONI VENETE DELL'ARGENTINA",
        comitato: "Scopri il CAVA",
        instagram: "Seguici su Instagram",
        facebook: "Seguici su Facebook",
        web: "Visita il nostro sito",
        mail: "Contattaci via email"
      },
      en: {
        subtitulo: "COMMITTEE OF VENETIAN ASSOCIATIONS OF ARGENTINA",
        comitato: "Meet CAVA",
        instagram: "Follow us on Instagram",
        facebook: "Follow us on Facebook",
        web: "Visit our website",
        mail: "Contact us by email"
      }
    };

    function existeIdioma(codigo) {
      return Object.prototype.hasOwnProperty.call(TRADUCCIONES, codigo);
    }

    function aplicarIdioma(codigo) {
      document.documentElement.lang = codigo;
      document.querySelectorAll("[data-i18n]").forEach(function (elemento) {
        elemento.textContent = TRADUCCIONES[codigo][elemento.getAttribute("data-i18n")];
      });
      document.querySelectorAll("[data-idioma]").forEach(function (boton) {
        boton.setAttribute("aria-pressed", String(boton.getAttribute("data-idioma") === codigo));
      });
    }

    function leerIdiomaGuardado() {
      try {
        return localStorage.getItem("idioma");
      } catch (error) {
        return null;
      }
    }

    function guardarIdioma(codigo) {
      try {
        localStorage.setItem("idioma", codigo);
      } catch (error) {
        // Si el navegador no deja guardar, el idioma cambia igual durante esta visita.
      }
    }

    // Primero respeta lo que eligió la persona; si no eligió nada,
    // recorre los idiomas del dispositivo y usa el primero disponible.
    function elegirIdioma() {
      var guardado = leerIdiomaGuardado();
      if (existeIdioma(guardado)) return guardado;

      var idiomas = navigator.languages || [navigator.language];
      for (var i = 0; i < idiomas.length; i++) {
        var codigo = idiomas[i].slice(0, 2).toLowerCase();
        if (existeIdioma(codigo)) return codigo;
      }
      return "es";
    }

    document.querySelectorAll("[data-idioma]").forEach(function (boton) {
      boton.addEventListener("click", function () {
        var codigo = boton.getAttribute("data-idioma");
        guardarIdioma(codigo);
        aplicarIdioma(codigo);
      });
    });

    aplicarIdioma(elegirIdioma());
  </script>
